# Infrastructure only, for running the services from your IDE:  docker compose -f docker-compose.infra.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: veil, POSTGRES_PASSWORD: veil, POSTGRES_DB: veil }
    volumes: ["./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    ports: ["5432:5432"]
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
  kafka:
    image: apache/kafka:3.9.2
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
