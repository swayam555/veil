# Full stack:  docker compose up --build    then open http://localhost:3004
#   Console sign-in: admin@acme.test / veil-admin (or auditor@acme.test / veil-auditor, read-only)
#   OpenAI-compatible proxy: http://localhost:8085/v1 (or http://localhost:3004/v1) with a Veil virtual key
# Optional real LLMs: copy .env.example to .env (UPSTREAM_* for the proxy, AI_* for the copilot and explainer).

x-java: &java
  restart: unless-stopped
  environment: &java-env
    REDIS_HOST: redis
    KAFKA_BOOTSTRAP: kafka:9092
    DB_HOST: postgres
    DB_USER: veil
    DB_PASSWORD: veil
    JWT_SECRET: ${JWT_SECRET:-change-me-in-production-this-is-a-32+-byte-dev-secret}
    VEIL_MASTER_KEY: ${VEIL_MASTER_KEY:-3q2+7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    CONTROL_PLANE_URL: http://control-plane:8202
    PROXY_URL: http://guard-proxy:8201
    INSIGHT_URL: http://insight-service:8203
    AI_PROVIDER: ${AI_PROVIDER:-none}
    AI_API_KEY: ${AI_API_KEY:-}
    AI_BASE_URL: ${AI_BASE_URL:-}
    AI_MODEL: ${AI_MODEL:-}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: veil
      POSTGRES_PASSWORD: veil
      POSTGRES_DB: veil
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veil"]
      interval: 5s
      retries: 20
    mem_limit: 256m

  # Redis 8 ships the Query Engine with vector search, used by the semantic cache.
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    mem_limit: 160m

  kafka:
    image: apache/kafka:3.9.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx320m -Xms320m"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 20
    mem_limit: 640m

  control-plane:
    <<: *java
    build: { context: ., target: control-plane }
    image: veil/control-plane:1.0.0
    environment:
      <<: *java-env
      DB_NAME: control
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
      UPSTREAM_MODEL: ${UPSTREAM_MODEL:-}
    healthcheck: &health
      test: ["CMD", "curl", "-fs", "http://localhost:8202/actuator/health/readiness"]
      interval: 10s
      retries: 30
      start_period: 30s
    mem_limit: 448m

  guard-proxy:
    <<: *java
    build: { context: ., target: guard-proxy }
    image: veil/guard-proxy:1.0.0
    environment:
      <<: *java-env
      # The ONNX embedding model lives outside the Java heap, so leave it native memory.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      control-plane: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fs", "http://localhost:8201/actuator/health/readiness"]
      start_period: 60s
    ports: ["8085:8201"]
    mem_limit: 1g

  insight-service:
    <<: *java
    build: { context: ., target: insight-service }
    image: veil/insight-service:1.0.0
    environment:
      <<: *java-env
      DB_NAME: insight
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fs", "http://localhost:8203/actuator/health/readiness"]
    mem_limit: 448m

  edge-gateway:
    <<: *java
    build: { context: ., target: edge-gateway }
    image: veil/edge-gateway:1.0.0
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
    ports: ["8084:8080"]
    mem_limit: 320m

  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    image: veil/frontend:1.0.0
    restart: unless-stopped
    depends_on: [edge-gateway]
    ports: ["3004:80"]
    mem_limit: 64m

volumes:
  pgdata:
  kafkadata:
