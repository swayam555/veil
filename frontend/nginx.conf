server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 4m;

    # Long-lived live feed (Server-Sent Events) through the gateway: no buffering, long timeout.
    location = /api/insight/live {
        proxy_pass http://edge-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://edge-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # The OpenAI-compatible API goes straight to the proxy (it authenticates with virtual keys itself).
    # Buffering off so streamed answers reach the client token by token.
    location /v1/ {
        proxy_pass http://guard-proxy:8201;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /downloads/ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|woff2?|png|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri $uri/ /index.html;
    }
}
