spring:
  application:
    name: insight-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:insight}
    username: ${DB_USER:veil}
    password: ${DB_PASSWORD:veil}
    hikari:
      maximum-pool-size: 12
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
  mvc:
    async:
      request-timeout: -1

server:
  port: ${PORT:8203}
  shutdown: graceful

veil:
  retention-days: ${RETENTION_DAYS:30}
  ai:
    provider: ${AI_PROVIDER:none}
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:}
    model: ${AI_MODEL:}
    timeout: ${AI_TIMEOUT:60s}

springdoc:
  api-docs:
    path: /api/insight/openapi
  swagger-ui:
    path: /api/insight/docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
