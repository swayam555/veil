apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: veil
resources:
  - namespace.yaml
  - config.yaml
  - infra.yaml
  - apps.yaml
  - frontend.yaml
  - network-policy.yaml
# Point the images at your registry, e.g.  kustomize edit set image ghcr.io/your-org/veil-guard-proxy=...
images:
  - name: ghcr.io/your-org/veil-edge-gateway
    newTag: 1.0.0
  - name: ghcr.io/your-org/veil-control-plane
    newTag: 1.0.0
  - name: ghcr.io/your-org/veil-guard-proxy
    newTag: 1.0.0
  - name: ghcr.io/your-org/veil-insight-service
    newTag: 1.0.0
  - name: ghcr.io/your-org/veil-frontend
    newTag: 1.0.0
