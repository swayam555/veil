            - configMapRef: { name: veil-config }
            - secretRef: { name: veil-secrets }
          env:
            - { name: PORT, value: "8203" }
            - { name: DB_NAME, value: insight }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
