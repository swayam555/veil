          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: insight-service
spec:
  selector: { app: insight-service }
  ports: [{ port: 8203, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
