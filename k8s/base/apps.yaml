metadata:
  name: insight-service
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: insight-service }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
